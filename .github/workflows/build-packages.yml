name: Build scutclient packages

on:
  workflow_dispatch:
    inputs:
      release:
        description: ImmortalWrt version (25.12 = APK, 24.10 = IPK)
        type: choice
        default: '25.12.2'
        options:
          - '25.12.2'
          - '24.10.6'
      architecture:
        description: Package architecture (not the runner CPU)
        type: choice
        default: aarch64_cortex-a53
        options:
          - aarch64_cortex-a53
          - aarch64_generic
          - x86_64
          - mipsel_24kc
          - mips_24kc
          - all

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - name: Validate build scripts and select SDKs
        id: matrix
        env:
          RELEASE: ${{ inputs.release }}
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          python3 -m unittest discover -s tests -v
          bash -n scripts/build-packages.sh
          shellcheck scripts/build-packages.sh
          echo "matrix=$(python3 scripts/sdk_matrix.py "$RELEASE" "$ARCHITECTURE")" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: ImmortalWrt ${{ matrix.release }} / ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - name: Install SDK host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3 python3-setuptools rsync \
            swig unzip zlib1g-dev file wget curl zstd ca-certificates \
            patch perl tar time xz-utils
      - name: Build and verify both packages
        id: packages
        env:
          RELEASE: ${{ matrix.release }}
          ARCHITECTURE: ${{ matrix.arch }}
          WORK_DIR: ${{ runner.temp }}/scutclient-build
          OUTPUT_DIR: ${{ runner.temp }}/scutclient-output
        run: bash scripts/build-packages.sh "$RELEASE" "$ARCHITECTURE" "$WORK_DIR" "$OUTPUT_DIR"
      - name: Upload scutclient package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.packages.outputs.core_package }}
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Upload luci-app-scutclient package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.packages.outputs.luci_package }}
          archive: false
          if-no-files-found: error
          retention-days: 30
