name: Build scutclient packages

on:
  workflow_dispatch:
    inputs:
      release:
        description: ImmortalWrt version (25.12 = APK, 24.10 = IPK)
        type: choice
        default: '25.12.2'
        options:
          - '25.12.2'
          - '24.10.6'
      architecture:
        description: Package architecture (not the runner CPU)
        type: choice
        default: aarch64_cortex-a53
        options:
          - aarch64_cortex-a53
          - aarch64_generic
          - x86_64
          - mipsel_24kc
          - mips_24kc
          - all

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate build scripts and select SDKs
        id: matrix
        env:
          RELEASE: ${{ inputs.release }}
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          python3 -m unittest discover -s tests -v
          bash -n scripts/build-packages.sh
          shellcheck scripts/build-packages.sh
          echo "matrix=$(python3 scripts/sdk_matrix.py "$RELEASE" "$ARCHITECTURE")" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: ImmortalWrt ${{ matrix.release }} / ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install SDK host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3 python3-setuptools rsync \
            swig unzip zlib1g-dev file wget curl zstd ca-certificates \
            patch perl tar time xz-utils
      - name: Build and verify both packages
        env:
          RELEASE: ${{ matrix.release }}
          ARCHITECTURE: ${{ matrix.arch }}
          WORK_DIR: ${{ runner.temp }}/scutclient-build
          OUTPUT_DIR: ${{ runner.temp }}/scutclient-output
        run: bash scripts/build-packages.sh "$RELEASE" "$ARCHITECTURE" "$WORK_DIR" "$OUTPUT_DIR"
      - name: Upload installable packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scutclient-immortalwrt-${{ matrix.release }}-${{ matrix.arch }}-${{ matrix.format }}
          path: ${{ runner.temp }}/scutclient-output/packages/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-immortalwrt-${{ matrix.release }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/scutclient-output/logs/
            ${{ runner.temp }}/scutclient-build/sdk/logs/
          if-no-files-found: warn
          retention-days: 30
